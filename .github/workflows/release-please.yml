name: Release Please

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # for pushing the tag and creating the release
      pull-requests: write # for opening the release pull request
      issues: write # for creating the labels that pull request is marked with
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-release: ${{ steps.release-please.outputs.release_created }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please

  release:
    name: Release
    needs: [release-please]
    if: ${{ needs.release-please.outputs.should-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # for uploading the release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
          fetch-depth: 0 # goreleaser does not support shallow clones
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  homebrew-tap:
    name: Homebrew Tap
    needs: [release-please, release]
    if: ${{ needs.release-please.outputs.should-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # for checking out this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate the formula
        run: go run ./cmd/formula -version "${TAG_NAME#v}" > blot.rb
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write # for committing the formula
      - name: Commit the formula to the tap
        run: |
          path="repos/${OWNER}/homebrew-tap/contents/Formula/blot.rb"
          sha=$(gh api "$path" --jq .sha)
          gh api --method PUT "$path" \
            -f "message=chore: update blot to ${TAG_NAME}" \
            -f "content=$(base64 -w0 blot.rb)" \
            -f "sha=$sha"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
