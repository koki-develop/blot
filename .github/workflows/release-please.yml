name: Release Please

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # for pushing the tag and creating the release
      pull-requests: write # for opening the release pull request
      issues: write # for creating the labels that pull request is marked with
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-release: ${{ steps.release-please.outputs.release_created }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          release-type: go

  release:
    name: Release
    needs: [release-please]
    if: ${{ needs.release-please.outputs.should-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # for uploading the release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
          fetch-depth: 0 # goreleaser does not support shallow clones
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
